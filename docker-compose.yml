# Start:  DAYMARK_PASSWORD='choose-a-strong-one' docker compose up -d
# The password is only used to create the account on first start (stored hashed in ./data).
# Open the server address to sign in. Plain HTTP is for LAN only (cookie is not Secure);
# use HTTPS (e.g. Caddy) for a public address. Upgrading requires every device to sign in again.
services:
  daymark:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      # Behind a host reverse proxy, replace the mapping above with:
      # - "127.0.0.1:3000:3000"
    environment:
      DAYMARK_USER: ${DAYMARK_USER:-admin}
      DAYMARK_PASSWORD: ${DAYMARK_PASSWORD:-}
      DAYMARK_TRUST_PROXY: ${DAYMARK_TRUST_PROXY:-loopback}
    volumes:
      - ./data:/data
