    <meta charset="UTF-8" />
    <script>
      try {
        const a = JSON.parse(localStorage.getItem('daymark_theme') || 'null');
        document.documentElement.classList.toggle('dark', a ? a.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.fontSize = ({ s: 15, m: 16, l: 17.5 }[a?.textSize] || 16) + 'px';
      } catch {}
    </script>
