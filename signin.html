<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>Sign in - Daymark</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <script>
      try {
        const a = JSON.parse(localStorage.getItem('daymark_theme') || 'null');
        document.documentElement.classList.toggle('dark', a ? a.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.fontSize = ({ s: 15, m: 16, l: 17.5 }[a?.textSize] || 16) + 'px';
      } catch {}
    </script>
  </head>
  <body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased min-h-screen">
    <main class="min-h-screen flex items-center justify-center p-6">
      <section class="w-full max-w-sm rounded-2xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 p-6 sm:p-8 shadow-sm" aria-labelledby="signin-title">
        <p class="text-sm font-semibold text-stone-500 dark:text-stone-400 mb-2">Daymark</p>
        <h1 id="signin-title" class="text-2xl font-bold mb-6">Sign in</h1>
        <form id="signin-form" class="space-y-4" hidden>
          <div>
            <label for="username" class="block text-sm font-medium mb-2">Username</label>
            <input id="username" name="username" value="admin" autocomplete="username" required class="w-full rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-950 px-3 py-3" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium mb-2">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-950 px-3 py-3" />
          </div>
          <button id="signin-submit" type="submit" class="w-full px-4 py-3 min-h-14 rounded-xl font-semibold bg-accent text-accent-fg hover:brightness-95 disabled:opacity-50">Sign in</button>
        </form>
        <p id="signin-error" role="alert" aria-live="polite" class="mt-4 min-h-5 text-sm text-stone-700 dark:text-stone-300"></p>
      </section>
    </main>
    <script type="module" src="/src/signin/main.ts"></script>
  </body>
</html>
