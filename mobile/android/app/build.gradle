apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose' // Jetpack Glance (home-screen widget) is Compose-based

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningValues = [:]
def releaseSigningError = null
[
    storeFile: 'DAYMARK_KEYSTORE',
    storePassword: 'DAYMARK_KEYSTORE_PASSWORD',
    keyAlias: 'DAYMARK_KEY_ALIAS',
    keyPassword: 'DAYMARK_KEY_PASSWORD'
].each { property, variable ->
    def value = System.getenv(variable) ?: keystoreProperties.getProperty(property)
    if (!value?.trim()) {
        releaseSigningError = releaseSigningError ?: "Release signing missing ${variable} (${property}). See docs/guide/getting-started.md."
    }
    releaseSigningValues[property] = value
}
if (!releaseSigningError) {
    def keystore = rootProject.file(releaseSigningValues.storeFile)
    if (keystore.name.equalsIgnoreCase('debug.keystore')) {
        releaseSigningError = 'Release signing must not use debug.keystore. See docs/guide/getting-started.md.'
    } else if (!keystore.isFile()) {
        releaseSigningError = 'Release signing DAYMARK_KEYSTORE (storeFile) does not exist. See docs/guide/getting-started.md.'
    }
}
// Validate the resolved task graph, including release tasks invoked directly or via
// aggregate tasks. Debug builds need no signing credentials.
gradle.taskGraph.whenReady { graph ->
    if (releaseSigningError && graph.allTasks.any { it.project == project && it.name.toLowerCase(java.util.Locale.ROOT).contains('release') }) {
        throw new GradleException(releaseSigningError)
    }
}

android {
    namespace = "app.daymark.notes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.daymark.notes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1131
        versionName "1.13.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (!releaseSigningError) {
                storeFile rootProject.file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    testImplementation "junit:junit:$junitVersion"
    // JVM tests need a real JSON implementation instead of Android's throwing stub.
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
